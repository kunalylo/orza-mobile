// ÖRZA automatic step counting — local Expo module (autolinked from ./modules). Same pattern as modules/orza-alarms.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'in.co.ylo.orza'
version = '1.0.0'

android {
  namespace "expo.modules.orzasteps"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Recording API on mobile (LocalRecordingClient, steps only). 21.3.0 is the latest on Google Maven (checked
  // 2026-11-01); it adds no permission to the merged manifest (checked after prebuild, docs/notes/steps-v2.md §4.2).
  implementation 'com.google.android.gms:play-services-fitness:21.3.0'
  // Health Connect feature / grant checks (HealthFeatures) — the same version react-native-health-connect 4.1.3 uses.
  implementation 'androidx.health.connect:connect-client:1.1.0'
}
